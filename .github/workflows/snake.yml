name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1565c0&color_dots=#ebedf0,#caf0f8,#90e0ef,#38a0ff,#1565c0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38a0ff&color_dots=#161b22,#0b3a66,#1565c0,#38a0ff,#bddfff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
